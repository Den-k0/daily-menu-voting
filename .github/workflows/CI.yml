name: CI

on:
  pull_request:
    branches:
      - "main"
      - "develop"
  workflow_dispatch:

jobs:
  ruff_check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Run Ruff linter
        run: poetry run ruff check

  test:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: "3.12"

        - name: Install Poetry
          run: pip install poetry

        - name: Install dependencies
          run: poetry install --no-root --no-interaction

        - name: Run tests
          run: poetry run python manage.py test
          env:
            POSTGRES_DB: test
            POSTGRES_USER: test
            POSTGRES_PASSWORD: test
            POSTGRES_HOST: test
            POSTGRES_PORT: 5432
